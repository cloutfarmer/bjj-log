name: claude-pr-review

# Runs the ponytail-review skill once per pull request and posts one comment with
# its findings. It never changes code. It does not re-run on every push: add the
# `claude-review` label to run it again. Drafts, docs-only PRs and PRs from forks
# are skipped, because this repository is public and the job holds a token.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ponytail-review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Run the ponytail-review skill on this pull request: review the diff
            between origin/${{ github.event.pull_request.base.ref }} and HEAD.
            Read AGENTS.md first and treat a broken invariant there as a bug.
            Do not change any file.

            Post the full review as exactly one comment with `gh pr comment`.
            This repository is public, so never put secrets, environment values,
            URLs of deployments or journal text in the comment.
          claude_args: |
            --model opus
            --max-turns 40
            --allowedTools "Skill,Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

      - name: Clear the re-run label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label claude-review || true
