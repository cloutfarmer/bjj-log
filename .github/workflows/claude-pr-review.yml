name: claude-pr-review

# Runs the pr-triage skill (ponytail-review plus tier sorting) once per pull
# request. It fixes critical and trivial findings in one commit on the PR branch,
# files the rest as issues, and posts one summary comment. It does not re-run on
# every push: add the `claude-review` label to run it again. Drafts, docs-only PRs
# and PRs from forks are skipped, because this repository is public and the job
# holds a token with write access. PRs whose source branch is `dev` or `prod` are
# skipped too, because the bot pushes fixes to the source branch.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-triage:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'dev' &&
      github.event.pull_request.head.ref != 'prod' &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Needed for typecheck and lint on the fix commit. No database or secrets.
      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}
            PR BRANCH: ${{ github.event.pull_request.head.ref }}

            Run the pr-triage skill on this pull request.
            To push a fix commit, use exactly:
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          claude_args: |
            --model opus
            --max-turns 60
            --allowedTools "Skill,Read,Glob,Grep,Edit,Write,Bash(npm run typecheck),Bash(npm run lint),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD:${{ github.event.pull_request.head.ref }}),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh label create:*)"

      - name: Clear the re-run label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label claude-review || true
